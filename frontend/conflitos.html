<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Visualização & Conflitos · Grade Solidária</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="assets/icone.svg" rel="icon" type="image/svg+xml" />
    <link href="assets/estilo.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <script src="assets/app.js"></script>
</head>

<body class="bg-surface font-body-md text-on-surface antialiased">
    <main>
        <div class="flex flex-col w-full gap-space-xl">
            <section class="flex flex-col gap-space-lg">
                <div id="cabecalho"></div>
                <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-space-md"></div>
            </section>

            <!-- Mapa da semana (RF07, RF08) -->
            <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
                <div class="px-space-lg py-space-md bg-surface-container-low flex flex-col sm:flex-row sm:items-center justify-between gap-space-sm">
                    <span class="font-title-md text-title-md text-primary font-semibold">Mapa da semana — todas as turmas</span>
                    <div class="flex items-center gap-space-md flex-wrap font-body-sm text-body-sm text-on-surface-variant">
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-secondary"></span>Garantida</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-warning"></span>Sem professor</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-error"></span>Conflito</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-surface-container-high"></span>Livre</span>
                    </div>
                </div>
                <div id="mapa" class="p-space-md grid grid-cols-1 lg:grid-cols-2 gap-space-lg overflow-x-auto"></div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-space-lg items-start">
                <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
                    <div class="px-space-lg py-space-md bg-error-container/40 flex items-center gap-space-xs">
                        <span class="material-symbols-outlined text-error">error</span>
                        <span class="font-title-md text-title-md text-on-error-container font-semibold">Conflitos — alocações inválidas (RF09)</span>
                    </div>
                    <div id="listaConflitos" class="p-space-md flex flex-col gap-space-sm"></div>
                </section>
                <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
                    <div class="px-space-lg py-space-md bg-warning-container/50 flex items-center gap-space-xs">
                        <span class="material-symbols-outlined text-warning">person_off</span>
                        <span class="font-title-md text-title-md text-on-warning-container font-semibold">Aulas sem professor (RN04, RN09)</span>
                    </div>
                    <div id="listaDescobertas" class="p-space-md flex flex-col gap-space-sm"></div>
                </section>
                <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
                    <div class="px-space-lg py-space-md bg-surface-container-low flex items-center gap-space-xs">
                        <span class="material-symbols-outlined text-tertiary-container">playlist_add</span>
                        <span class="font-title-md text-title-md text-primary font-semibold">Cobertura insuficiente da demanda (RF10)</span>
                    </div>
                    <div id="listaDemanda" class="p-space-md flex flex-col gap-space-sm"></div>
                </section>
                <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
                    <div class="px-space-lg py-space-md bg-surface-container-low flex items-center gap-space-xs">
                        <span class="material-symbols-outlined text-error">crisis_alert</span>
                        <span class="font-title-md text-title-md text-primary font-semibold">Voluntários acima do limite (RF15)</span>
                    </div>
                    <div id="listaCarga" class="p-space-md flex flex-col gap-space-sm"></div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const { esc, cls, $, DIAS } = App;

        function render(e) {
            const i = e.indicadores;
            const pend = i.conflitos + i.descobertas;
            $('#cabecalho').innerHTML = App.cabecalho({
                modulo: 'MÓDULO 05 • ALERTAS',
                titulo: 'Visualização & Conflitos',
                descricao: pend ? `Há ${pend} aula(s) que precisam de atenção antes de a grade ser divulgada. Resolva na grade ou busque um substituto.` : 'Nenhuma aula com problema. Grade fechada, aula garantida!',
                acoes: `<a href="grade.html" class="${cls.btnPrim}"><span class="material-symbols-outlined text-[18px]">calendar_month</span>Abrir grade</a>`,
            });

            $('#kpis').innerHTML = [
                App.kpi({ rotulo: 'Conflitos', valor: i.conflitos, unidade: 'alocações inválidas', icone: 'error', cor: i.conflitos ? 'text-error' : 'text-secondary' }),
                App.kpi({ rotulo: 'Sem professor', valor: i.descobertas, unidade: 'aulas descobertas', icone: 'person_off', cor: i.descobertas ? 'text-warning' : 'text-secondary' }),
                App.kpi({ rotulo: 'Faltando na grade', valor: i.faltando, unidade: 'aulas da demanda', icone: 'playlist_add', cor: i.faltando ? 'text-tertiary-container' : 'text-secondary' }),
                App.kpi({ rotulo: 'Sobrecarga', valor: i.sobrecarregados, unidade: 'voluntários', icone: 'crisis_alert', cor: i.sobrecarregados ? 'text-error' : 'text-secondary' }),
            ].join('');

            // Mapa compacto de todas as turmas
            const { dias, linhas, celula } = App.estrutura(e);
            const corDe = { coberta: 'bg-secondary text-on-secondary', descoberta: 'bg-warning text-white', conflito: 'bg-error text-on-error' };
            $('#mapa').innerHTML = e.turmas.map((t) => `
                <div class="flex flex-col gap-space-xs min-w-[420px]">
                    <a href="grade.html?turma=${t.id}" class="font-title-md text-title-md text-on-surface hover:text-primary">${esc(t.nome)} <span class="font-label-sm text-label-sm text-on-surface-variant">${esc(t.descricao || '')}</span></a>
                    <div class="grid gap-1" style="grid-template-columns: 44px repeat(${dias.length}, minmax(0, 1fr))">
                        <div></div>${dias.map((d) => `<div class="text-center font-label-sm text-label-sm text-on-surface-variant uppercase">${DIAS[d]}</div>`).join('')}
                        ${Array.from({ length: linhas }, (_, k) => k + 1).map((ordem) => `
                            <div class="font-label-sm text-label-sm text-on-surface-variant flex items-center">${ordem}ª</div>
                            ${dias.map((d) => {
                                const h = celula(d, ordem);
                                if (!h) return '<div class="h-9"></div>';
                                const a = e.aulaEm(t.id, h.id);
                                if (!a) return `<a href="grade.html?turma=${t.id}" title="Livre — ${DIAS[d]} ${h.inicio}" class="h-9 rounded bg-surface-container-high hover:ring-2 hover:ring-primary"></a>`;
                                const disc = e.mapa.disc.get(a.disciplina_id).nome;
                                const prof = a.voluntario_id ? e.mapa.vol.get(a.voluntario_id).nome : 'sem professor';
                                return `<a href="grade.html?aula=${a.id}" title="${esc(`${disc} · ${prof}${a.problemas.length ? '\n' + a.problemas.map((p) => p.msg).join('\n') : ''}`)}"
                                    class="h-9 rounded ${corDe[a.status]} hover:ring-2 hover:ring-primary flex items-center justify-center font-label-sm text-label-sm truncate px-1">${esc(disc.slice(0, 4))}</a>`;
                            }).join('')}`).join('')}
                    </div>
                </div>`).join('') || App.vazio('Nenhuma turma cadastrada.', 'meeting_room');

            const cartaoAula = (alerta) => {
                const a = e.mapa.aula.get(alerta.aula_id);
                const prof = a.voluntario_id ? e.mapa.vol.get(a.voluntario_id) : null;
                return `<div class="p-space-sm rounded-lg bg-surface-container-low flex flex-col gap-space-xs">
                    <div class="flex items-start justify-between gap-space-sm flex-wrap">
                        <div class="flex flex-col">
                            <span class="font-code-sm text-code-sm text-on-surface-variant uppercase">${esc(alerta.titulo)}</span>
                            <span class="font-title-md text-title-md text-on-surface">${esc(e.mapa.disc.get(a.disciplina_id).nome)}${prof ? ` · ${esc(prof.nome)}` : ''}</span>
                        </div>${App.chipStatus(a.status)}
                    </div>
                    ${App.listaProblemas(a.problemas)}
                    <div class="flex gap-space-xs flex-wrap">
                        <a href="substituicoes.html?aula=${a.id}" class="inline-flex items-center gap-1 px-space-sm py-1 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary">
                            <span class="material-symbols-outlined text-[16px]">swap_horiz</span>${prof ? 'Buscar substituto' : 'Achar professor'}</a>
                        <a href="grade.html?aula=${a.id}" class="inline-flex items-center gap-1 px-space-sm py-1 rounded-lg bg-surface-container-lowest font-label-md text-label-md hover:bg-surface-container">
                            <span class="material-symbols-outlined text-[16px]">edit_calendar</span>Editar na grade</a>
                    </div>
                </div>`;
            };
            const por = (tipo) => e.alertas.filter((x) => x.tipo === tipo);
            $('#listaConflitos').innerHTML = por('conflito').map(cartaoAula).join('') || App.vazio('Nenhum conflito na grade.');
            $('#listaDescobertas').innerHTML = por('descoberta').map(cartaoAula).join('') || App.vazio('Todas as aulas têm professor.');
            const demanda = [...por('capacidade'), ...por('demanda'), ...por('excesso')];
            $('#listaDemanda').innerHTML = demanda.map((x) => `
                <div class="p-space-sm rounded-lg ${x.gravidade === 'erro' ? 'bg-error-container/40' : x.gravidade === 'info' ? 'bg-surface-container-low' : 'bg-surface-container-low'} flex items-center justify-between gap-space-sm">
                    <div class="flex flex-col"><span class="font-code-sm text-code-sm text-on-surface-variant uppercase">${esc(x.titulo)}${x.tipo === 'excesso' ? ' · acima da demanda' : ''}</span>
                        <span class="font-body-md text-body-md text-on-surface">${esc(x.msg)}</span></div>
                    <a href="grade.html?turma=${x.turma_id}" class="${cls.btnIcone}" title="Abrir grade da turma"><span class="material-symbols-outlined text-[18px]">arrow_forward</span></a>
                </div>`).join('') || App.vazio('A grade atende toda a demanda semanal.');
            $('#listaCarga').innerHTML = por('sobrecarga').map((x) => {
                const v = e.mapa.vol.get(x.voluntario_id);
                return `<div class="p-space-sm rounded-lg bg-surface-container-low flex items-center justify-between gap-space-sm flex-wrap">
                    <div class="flex items-center gap-space-sm">${App.avatar(v, 'w-8 h-8')}<span class="font-title-md text-title-md">${esc(v.nome)}</span></div>
                    ${App.barraCarga(v)}
                    <a href="substituicoes.html?voluntario=${v.id}" class="inline-flex items-center gap-1 px-space-sm py-1 rounded-lg bg-surface-container-lowest font-label-md text-label-md hover:bg-surface-container">
                        <span class="material-symbols-outlined text-[16px]">balance</span>Redistribuir</a>
                </div>`;
            }).join('') || App.vazio('Ninguém acima do limite combinado.');
        }

        App.start({ ativo: 'conflitos.html', render });
    </script>
</body>

</html>
